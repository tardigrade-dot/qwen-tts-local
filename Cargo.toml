
[package]
name = "qwen-tts-local"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "qwen3-tts-local"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.7"
tower = "0.4"
hyper = "1"
libc = "0.2"

[build-dependencies]
cc = "1.0"
