
[package]
name = "qwen-tts-local"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "qwen-tts"
path = "src/main.rs"

[build-dependencies]
bindgen = "0.72"
cc = { version = "1", features = ["parallel"] }

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
axum = { version = "0.8", features = ["json", "macros"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
bytes = "1"
chrono = "0.4"
rand = "0.10"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
async-stream = "0.3"
http-body-util = "0.1"
futures-util = "0.3"
